<!DOCTYPE html>
<html>
<head>
    <title>Perfumy - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #d09d69db;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #EADFD7;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        h2 {
            color: #5C3D2E;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: transparent;
        }

        .input-group label {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #7A6C5D;
            font-size: 14px;
            transition: 0.3s ease;
            pointer-events: none;
            background-color: #EADFD7;
            padding: 0 4px;
        }

        .input-group input:focus + label,
        .input-group input:valid + label {
            top: -8px;
            left: 10px;
            font-size: 12px;
            color: #B76E79;
        }

        .input-group input:focus {
            border-color: #B76E79;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #B76E79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #8C5E58;
        }

        .signup-link {
            margin-top: 15px;
            display: block;
            font-size: 14px;
            color: #5C3D2E;
            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
            color:#b66f23
        }
        .home-link{
            margin-top:15px;
            display:block;
            font-size: 14px;
            color:#5C3D2E;
            text-decoration: none;
        }
        .home-link:hover{
            color:#b66f23;
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Login to Perfumy</h2>

        <form>
            <div class="input-group">
                <input type="email" required>
                <label>Email</label>
            </div>

            <div class="input-group">
                <input type="password" required>
                <label>Password</label>
            </div>

            <button type="submit">Login</button>
        </form>

        <a href="signup.html" class="signup-link">Don't have an account? Sign Up</a>
        <a href="index.html" class="home-link">return to home page</a>
    </div>

</body>
</html>
