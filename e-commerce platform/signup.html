<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELCOME TO SHOPFY SIGNUP</title>
    <link rel="icon" href="sy.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
</head>
<style>
    *{
        margin:0;
        padding:0;
    }
    body {
            
            font-family: "Gravitas One", serif;
            background-color: rgb(128, 238, 202);
            justify-content:center;
            align-items:center;

    }
           
        nav{
          font-family: "Gravitas One", serif;
        font-weight: 400;
        font-style: normal;
        background-color: rgb(66, 50, 50);
        display:inline-block;
        color:aliceblue;
        padding-right:500px;
        width:100%;

        }
        h1{
            color:white;
        }
        h1:hover{
            color:rgb(128, 238, 202);
            cursor:pointer;

        }
        ul,li,h1{
            display:inline-block;

        }
        ul{
        width:100%;
        text-align: right;
        }
        li{
        color:aliceblue;
        }
        li:hover{
            color:rgb(128, 238, 202);
            cursor:pointer;
        }


        .signup-container{
            background-color: rgb(184, 237, 219);
            padding: 100px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 0 8px black;
            text-align: center;
            margin:10px;
        }

        h2 {
            color: #5C3D2E;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: transparent;
        }

        .input-group label {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #7A6C5D;
            font-size: 14px;
            transition: 0.3s ease;
            pointer-events: none;
            background-color: rgb(184, 237, 219);
            padding: 0 4px;
        }

        .input-group input:focus + label,
        .input-group input:valid + label {
            top: -8px;
            left: 10px;
            font-size: 12px;
            color: #B76E79;
        }

        .input-group input:focus {
            border-color: #B76E79;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: rgb(120, 164, 149);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color:rgb(128, 238, 202);
        }

        .login-link {
            margin-top: 15px;
            display: block;
            font-size: 14px;
            color: #5C3D2E;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
            color:rgb(120, 164, 149);
        }
        .home-link{
            margin-top:15px;
            display:block;
            font-size: 14px;
            color:#5C3D2E;
            text-decoration: none;
        }
        .home-link:hover{
            color:rgb(120, 164, 149);
            text-decoration:underline;
        }
 
</style>
<body>
    <nav>
        <h1>WELCOME TO SHOPFY SIGNUP!!!!</h1>
        <ul>
            <li>HOME|</li>
            <li>ABOUT US|
            </li>
            <li>CONTACT US|</li>
        </ul>

    </nav>
    <center>
    <div class="signup-container">
        <h2>SIGN UP TO SHOPFY</h2>
        <form>
            <div class="input-group">
                <input type="text" required>
                <label>FIRSTNAME</label>

            </div>
            <div class="input-group">
                <input type="text" required>
                <label>LASTNAME</label>
            </div>
            <div class="input-group">
                <input type="email" required>
                <label>EMAIL</label>
            </div>
            <div class="input-group">
                <input type="password" required>
                <label>PASSWORD</label>
            </div>
            
            <button type="submit" >SIGN UP</button>

        </form>
        <a href="login.html" class="login-link">Already have an account? Login</a>
        <a href="homepage.html" class="home-link">Back to homepage</a>
       </div>
    </center>
</body>
</html>
