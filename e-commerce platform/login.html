<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELCOME TO SHOPFY LOGIN PAGE</title>
    <LINK REL="ICON" href="sy.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">

</head>
<style>
    *{
        margin:0;
        padding:0;
    }
    body{
        background-color:rgb(128, 238, 202);
       
        font-family: "Gravitas One", serif;
        font-weight: 400;
        font-style: normal;
    }
    nav{
        background-color:rgb(66, 50, 50);
        color:aliceblue;
        display:inline-block;
        width:100%;
        font-family: "Gravitas One", serif;
        font-weight: 400;
        font-style: normal;

    }
    ul,li,h1{
        display:inline-block;
        text-align:right;

    }
    ul{
        width:100%;    
    }
    .login-container{
        background-color:rgb(184, 237, 219);
        padding:100px;
        box-shadow:0 0 8px black; 
        margin:10px;
        border-radius:12px;
        text-align:center;
        width:300px;
    }
    h2{
        margin-bottom:20px;
    }
    .input1{
        position:relative;
        margin-bottom:25px;

    }
    .input1 input{
        width:100%;
        padding:20px;
        border:1px solid #ccc;
        border-radius:12px;
        outline:none;
        font-size:14px;
        background:transparent;
    }
    .input1 label{
        position:absolute;
        top:50%;
        left:10px;
        color: #7A6C5D;
        font-size: 14px;
        transition: 0.3s ease;
        pointer-events: none;
        background-color: rgb(184, 237, 219);
        padding: 0 4px;
    }
    .input1 input:focus + label,
    .input1 input:valid + label {
        top: -10px;
        left: 5px;
        font-size: 12px;
        color: #B76E79;
    }
    .input-group input:focus {
            border-color: #B76E79;
        }
        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:3px;
            background-color:rgb(120, 164, 149);
            color:white;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background-color:rgb(128, 238, 202);
        }
        .signup-link{
            display:block;
            margin-top:15px;
            font-size:14px;
            color:#5C3D2E;
            text-decoration:none;


        }
        .signup-link:hover{
            text-decoration: underline;
            color:rgb(120, 164, 149);
        }
        .homepage-link{
            display:block;
            margin-top:15px;
            color:#5C3D2E;
            font-size:14px;
            text-decoration: none;

        }
        .homepage-link:hover{
            text-decoration:underline;
            color:rgb(120, 164, 149);
        }

            




</style>
<body>
    <nav>
        <h1>WELCOME TO SHOPFY LOGIN PAGE!!!</h1>
        <ul>
            <li>home|</li>
            <li>applications|</li>
            <li>contact us</li>
        </ul>
    </nav>
    <center>
    <div class="login-container">
        
        <h2>LOGIN TO YOUR ACCOUNT</h2>
        <form>
            <DIV CLASS="input1">
                <input type="email" required>
                <label>EMAIL</label>
            </DIV>
            <div class="input1">
                <input type="password" required>
                <label>PASSWORD</label>
            </div>
            <button type="submit">LOGIN</button>
        </form>
        <A href="signup.html" class="signup-link">don't have a account?signup</A>
        <a href="homepage.html" class="homepage-link">return to homepage</a> 

    </div>
    </center>
    
</body>
</html>
